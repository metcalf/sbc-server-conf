module(load="imudp")

template(name="RemoteTmpl" type="list") {
    constant(value="/var/log/remote/")
    property(name="hostname" SecurePath="replace")
    constant(value=".log")
}

ruleset(name="remote1"){
    action(type="omfile" DynaFile="RemoteTmpl")
    # A copy to VictoriaLogs for searching. RFC 5424 rather than the default
    # forwarding format, whose timestamps have no year or timezone.
    action(type="omfwd" target="127.0.0.1" port="5514" protocol="udp" template="RSYSLOG_SyslogProtocol23Format")
}

input(type="imudp" port="514" ruleset="remote1" RateLimit.Interval="60" RateLimit.Burst="1000")
