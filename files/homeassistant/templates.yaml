- trigger:
    - trigger: time
      at: '02:00:01'
    - trigger: homeassistant
      event: start
  binary_sensor:
    - name: "is_daylight_saving_time"
      state: "{{ now().timetuple().tm_isdst == 1 }}"

- trigger:
    - platform: time_pattern
      hours: /1
    - platform: homeassistant
      event: start
  action:
    - action: weather.get_forecasts
      data:
        type: daily
      target:
        entity_id: weather.pirateweather
      response_variable: daily
  sensor:
    - name: Weather Forecast - Today
      unique_id: weather_forecast_today
      state: "{{ daily['weather.pirateweather'].forecast[0].datetime }}"
      attributes:
        condition: "{{ daily['weather.pirateweather'].forecast[0].condition }}"
        temperature: "{{ daily['weather.pirateweather'].forecast[0].temperature }}"
        temp_low: "{{ daily['weather.pirateweather'].forecast[0].templow }}"
        precipitation: "{{ daily['weather.pirateweather'].forecast[0].precipitation }}"
        precipitation_probability: "{{ daily['weather.pirateweather'].forecast[0].precipitation_probability }}"
        wind_bearing: "{{ daily['weather.pirateweather'].forecast[0].wind_bearing }}"
        wind_speed: "{{ daily['weather.pirateweather'].forecast[0].wind_speed }}"
        humidity: "{{ daily['weather.pirateweather'].forecast[0].humidity }}"
        pressure: "{{ daily['weather.pirateweather'].forecast[0].pressure }}"
        uv_index: "{{ daily['weather.pirateweather'].forecast[0].uv_index }}"
