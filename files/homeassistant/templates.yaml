- trigger:
    - trigger: time
      at: '02:00:01'
    - trigger: homeassistant
      event: start
  binary_sensor:
    - name: "is_daylight_saving_time"
      state: "{{ now().timetuple().tm_isdst == 1 }}"

- trigger:
    - platform: time_pattern
      hours: /1
    - platform: homeassistant
      event: start
    # So new or changed sensors here fill in on deploy, not on the hour
    - platform: event
      event_type: event_template_reloaded
  action:
    - action: weather.get_forecasts
      data:
        type: daily
      target:
        entity_id: weather.pirateweather
      response_variable: daily
  sensor:
    - name: Weather Forecast - Today
      unique_id: weather_forecast_today
      state: "{{ daily['weather.pirateweather'].forecast[0].datetime }}"
      attributes:
        condition: "{{ daily['weather.pirateweather'].forecast[0].condition }}"
        temperature: "{{ daily['weather.pirateweather'].forecast[0].temperature }}"
        temp_low: "{{ daily['weather.pirateweather'].forecast[0].templow }}"
        precipitation: "{{ daily['weather.pirateweather'].forecast[0].precipitation }}"
        precipitation_probability: "{{ daily['weather.pirateweather'].forecast[0].precipitation_probability }}"
        wind_bearing: "{{ daily['weather.pirateweather'].forecast[0].wind_bearing }}"
        wind_speed: "{{ daily['weather.pirateweather'].forecast[0].wind_speed }}"
        humidity: "{{ daily['weather.pirateweather'].forecast[0].humidity }}"
        pressure: "{{ daily['weather.pirateweather'].forecast[0].pressure }}"
        uv_index: "{{ daily['weather.pirateweather'].forecast[0].uv_index }}"
    # The same high/low as above, as their own sensors so the recorder keeps
    # their history. Forecasts come back in the weather entity's unit (°F).
    - name: Forecast high today
      unique_id: forecast_high_today
      unit_of_measurement: °F
      device_class: temperature
      state_class: measurement
      state: "{{ daily['weather.pirateweather'].forecast[0].temperature }}"
    - name: Forecast low today
      unique_id: forecast_low_today
      unit_of_measurement: °F
      device_class: temperature
      state_class: measurement
      state: "{{ daily['weather.pirateweather'].forecast[0].templow }}"

# US EPA AQI from the Mila's PM2.5 reading. The Mila's own "Air Quality"
# sensor is HomeKit's 1-5 scale, not an AQI. Breakpoints are the EPA's 2024
# table, which truncates the concentration to 0.1 μg/m³; above the table the
# AQI stays at 500. The EPA defines AQI on a 24-hour average, so this is the
# AQI the instantaneous reading would be if it held.
- sensor:
    - name: Mila PM2.5 AQI
      unique_id: mila_pm2_5_aqi
      device_class: aqi
      state_class: measurement
      availability: "{{ states('sensor.mila_air_purifier_d98798_pm2_5_density') | is_number }}"
      state: >-
        {% set pm = states('sensor.mila_air_purifier_d98798_pm2_5_density') | float %}
        {% set c = [(pm * 10) | round(4) | int / 10, 0] | max %}
        {% set ns = namespace(aqi=500) %}
        {% for lo, hi, aqi_lo, aqi_hi in [
          (0.0, 9.0, 0, 50),
          (9.1, 35.4, 51, 100),
          (35.5, 55.4, 101, 150),
          (55.5, 125.4, 151, 200),
          (125.5, 225.4, 201, 300),
          (225.5, 325.4, 301, 500),
        ] if lo <= c <= hi %}
          {% set ns.aqi = ((aqi_hi - aqi_lo) / (hi - lo) * (c - lo) + aqi_lo) | round | int %}
        {% endfor %}
        {{ ns.aqi }}
