# Connection settings (api_version/host/port/database/ssl/verify_ssl) moved out of
# YAML in HA 2026.x and are being removed entirely in 2026.9. They now live in a UI
# config entry (Settings > Devices & Services > InfluxDB), imported from this file.
# Only non-connection options remain valid here and merge with the config entry.
influxdb:
  max_retries: 3
