---
services:
  homeassistant:
    # NOTE: We use this instead of the ghcr.io version since it runs unprivileged by default
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: host
    environment:
      - PUID=8123
      - PGID=8123
      - TZ=America/Los_Angeles
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /var/local/homeassistant:/config
    # This is only needed without `host` networking mode
    # ports:
    #   - 8123:8123
    security_opt:
      - no-new-privileges
    restart: unless-stopped
  tesla_ble_mqtt:
    image: iainbullock/tesla_ble_mqtt:latest
    container_name: tesla_ble_mqtt
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    volumes:
      - /run/dbus:/run/dbus
      - /var/local/tesla-ble-mqtt:/share/tesla_ble_mqtt
    env_file:
      - /var/local/tesla-ble-mqtt/mqtt.env
    restart: unless-stopped
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    # Required for mDNS to work correctly
    network_mode: host
    user: "8123:8123"
    # Needed for Bluetooth via dbus
    # security_opt:
      # - apparmor:unconfined
    volumes:
      # Create an .env file that sets the USERDIR environment variable.
      - /var/local/homeassistant/matter-server/data:/data/
      # Required for Bluetooth via D-Bus
      # - /run/dbus:/run/dbus:ro
    # If you adjust command line, make sure to pass the default CMD arguments too:
    #command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0
  matter-hub:
    # Publishes HA entities to Matter controllers (Alexa, etc). This is the
    # opposite direction from matter-server above, which lets HA control
    # Matter devices. The two coexist; they bind different ports.
    image: ghcr.io/riddix/home-assistant-matter-hub:latest
    container_name: matter-hub
    # Required by Matter: the bridge has to advertise over mDNS on the LAN
    network_mode: host
    user: "8123:8123"
    environment:
      - HAMH_LOG_LEVEL=info
      - HAMH_HTTP_PORT=8482
      # Without this, mDNS also advertises the docker0 address (172.17.0.1)
      # and controllers that latch onto it show every device as "No Response".
      - HAMH_MDNS_NETWORK_INTERFACE=eth0
    env_file:
      # Holds the HA URL and long-lived token, kept out of this file since
      # compose.yml is world-readable
      - /var/local/homeassistant/matter-hub/matter-hub.env
    volumes:
      # HAMH_STORAGE_LOCATION=/data is baked into the image
      - /var/local/homeassistant/matter-hub/data:/data
    security_opt:
      - no-new-privileges
    restart: unless-stopped
