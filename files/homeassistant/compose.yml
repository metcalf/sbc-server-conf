---
services:
  homeassistant:
    # NOTE: We use this instead of the ghcr.io version since it runs unprivileged by default
    image: lscr.io/linuxserver/homeassistant:latest
    container_name: homeassistant
    network_mode: host
    environment:
      - PUID=8123
      - PGID=8123
      - TZ=America/Los_Angeles
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - /var/run/dbus:/var/run/dbus:ro
      - /var/local/homeassistant:/config
    # This is only needed without `host` networking mode
    # ports:
    #   - 8123:8123
    security_opt:
      - no-new-privileges
    restart: unless-stopped
  tesla_ble_mqtt:
    image: iainbullock/tesla_ble_mqtt:latest
    container_name: tesla_ble_mqtt
    network_mode: host
    privileged: true
    tty: true
    stdin_open: true
    volumes:
      - /run/dbus:/run/dbus
      - /var/local/tesla-ble-mqtt:/share/tesla_ble_mqtt
    env_file:
      - /var/local/tesla-ble-mqtt/mqtt.env
    restart: unless-stopped
  matter-server:
    image: ghcr.io/home-assistant-libs/python-matter-server:stable
    container_name: matter-server
    restart: unless-stopped
    # Required for mDNS to work correctly
    network_mode: host
    user: "8123:8123"
    # Needed for Bluetooth via dbus
    # security_opt:
      # - apparmor:unconfined
    volumes:
      # Create an .env file that sets the USERDIR environment variable.
      - /var/local/homeassistant/matter-server/data:/data/
      # Required for Bluetooth via D-Bus
      # - /run/dbus:/run/dbus:ro
    # If you adjust command line, make sure to pass the default CMD arguments too:
    #command: --storage-path /data --paa-root-cert-dir /data/credentials --bluetooth-adapter 0
  matter-hub:
    # Publishes HA entities to Matter controllers (Alexa, etc). This is the
    # opposite direction from matter-server above, which lets HA control
    # Matter devices. The two coexist; they bind different ports.
    image: ghcr.io/riddix/home-assistant-matter-hub:latest
    container_name: matter-hub
    # Required by Matter: the bridge has to advertise over mDNS on the LAN
    network_mode: host
    user: "8123:8123"
    environment:
      - HAMH_LOG_LEVEL=info
      - HAMH_HTTP_PORT=8482
      # Without this, mDNS also advertises the docker0 address (172.17.0.1)
      # and controllers that latch onto it show every device as "No Response".
      - HAMH_MDNS_NETWORK_INTERFACE=eth0
    env_file:
      # Holds the HA URL and long-lived token, so it is 0600 root and lives
      # outside /var/local/homeassistant -- that is mounted as /config, and a
      # file HA's uid cannot read breaks its backups. Read by the docker
      # daemon on the host, not by the container, so root-only is fine.
      - /var/local/matter-hub/matter-hub.env
    volumes:
      # HAMH_STORAGE_LOCATION=/data is baked into the image. This one is
      # deliberately under /config so HA's backup captures the bridge and its
      # Matter fabric credentials.
      - /var/local/homeassistant/matter-hub/data:/data
    security_opt:
      - no-new-privileges
    restart: unless-stopped
  ha-mcp:
    # MCP server that lets Claude read state and make UI-style config changes.
    # It binds to loopback only; the outside world reaches it through nginx
    # (files/sites/ha-mcp) behind Cloudflare Access, so neither HA nor ha-mcp
    # is relied on to authenticate callers. :latest only moves on stable
    # releases (dev builds go to :dev), so it updates with HA on a pull.
    # Modules added upstream stay off until listed below.
    image: ghcr.io/homeassistant-ai/ha-mcp:latest
    container_name: ha-mcp
    command: ["ha-mcp-web"]
    # Host networking so it can reach HA on 127.0.0.1:8123, which ufw doesn't
    # expose to the docker bridge.
    network_mode: host
    environment:
      - MCP_HOST=127.0.0.1
      - MCP_PORT=9584
      - HA_MCP_DISABLE_SETTINGS_UI=true
      - HA_MCP_DISABLE_UPDATE_CHECK=true
      # An allowlist, since that's the only filter ha-mcp offers. Left out on
      # purpose: hacs, updates, backup, code (free-form API escape hatch),
      # resources (dashboard JS runs in every browser session), camera,
      # security_policy, bug_report and dev (ha-mcp's own settings, not HA's
      # Developer Tools, which are covered). addons, filesystem, yaml_config
      # and dashboard_screenshot need Supervisor or HA-side components we
      # don't run. YAML config is owned by this repo, not edited in place.
      - >-
        ENABLED_TOOL_MODULES=tools_areas,tools_assist_pipeline,tools_blueprints,
        tools_calendar,tools_categories,tools_config_automations,
        tools_config_dashboards,tools_config_helpers,tools_config_scenes,
        tools_config_scripts,tools_energy,tools_entities,tools_groups,
        tools_history,tools_integrations,tools_labels,tools_logs,
        tools_registry,tools_search,tools_service,tools_services,tools_system,
        tools_themes,tools_todo,tools_traces,tools_utility,
        tools_voice_assistant,tools_zones
    env_file:
      # HA URL and a long-lived token dedicated to ha-mcp, so it can be
      # revoked without touching hass_token. 0600 root, outside /config for
      # the same reason as matter-hub's.
      - /var/local/ha-mcp/ha-mcp.env
    security_opt:
      - no-new-privileges
    restart: unless-stopped
