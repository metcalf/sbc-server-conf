---
- name: Configure it all
  hosts: all
  remote_user: andrew
  become: true
  vars:
    ansible_remote_tmp: /tmp/ansible/tmp
    nonroot_login_user: andrew
    nodenv_root: /home/{{ nonroot_login_user }}/.nodenv
    victoriametrics_version: v1.140.0
    usb_partitions:
      - name: ExternalWindowsBackup
        uuid: "3175b897-e7fa-47cb-8e5a-3d87f8bd7c84"
        keyfile: "/etc/luks-keys/external_windowsbackup.key"
        owner: windowsbackup
      - name: ExternalTimeMachine
        uuid: "bae8ed76-3c26-43cf-b175-e4f538b50db9"
        owner: timemachinebackup
      - name: ExternalMisc
        uuid: "75f2aa1d-2fb5-4489-9839-fcdbd708cfcf"
        keyfile: "/etc/luks-keys/external_misc.key"
        owner: miscbackup
      - name: ExtData
        uuid: "22f135a3-f4e4-485f-8b9a-beea2cbca98d"
        owner: root
    # Every ext4 filesystem here, including the SD card root. mkfs defaults to
    # logging errors and carrying on, which let a corruption event in Apr 2026
    # rack up 258 errors on ExtData unnoticed while VictoriaMetrics kept writing
    # on top of it. Setting this in the superblock (rather than only in fstab)
    # also covers the kernel's initial mount of / and any manual mount.
    ext4_remount_ro_devices:
      - /dev/mmcblk0p2                            # /
      - /dev/sda2                                 # /mnt/ExternalTimeMachine
      - /dev/sda4                                 # /mnt/ExtData
      - /dev/mapper/ExternalWindowsBackup_crypt
      - /dev/mapper/ExternalMisc_crypt
  tasks:
    - name: Include secrets
      include_vars: secrets.yml
      tags: wip # Included so I get secrets with WIP tasks
    - import_tasks: tasks/system.yml
    - import_tasks: tasks/logging.yml
    - import_tasks: tasks/ddns.yml
    - import_tasks: tasks/samba.yml
    - import_tasks: tasks/apps.yml
    - import_tasks: tasks/ical-filter-proxy.yml
    - import_tasks: tasks/webserver.yml
    - import_tasks: tasks/mosquitto.yml
    - import_tasks: tasks/victoriametrics.yml
    - import_tasks: tasks/homeassistant.yml
  handlers:
    - import_tasks: handlers/main.yml
