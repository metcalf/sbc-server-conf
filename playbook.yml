---
- name: Configure it all
  hosts: all
  remote_user: andrew
  become: true
  vars:
    ansible_remote_tmp: /tmp/ansible/tmp
    nonroot_login_user: andrew
    nodenv_root: /home/{{ nonroot_login_user }}/.nodenv
    victoriametrics_version: v1.140.0
    # Encrypted partitions have no key stored on the server, so they stay
    # locked until unlocked by hand with the LUKS passphrase (see
    # external_drive_setup). The uuid of an encrypted partition is the LUKS
    # UUID, not that of the ext4 inside.
    #
    # WindowsBackup isn't encrypted because Kopia encrypts its repository on
    # the client, the same reasoning as Time Machine.
    usb_partitions:
      - name: ExternalWindowsBackup
        uuid: "19672cb1-6288-4acf-ac3e-55fb43bae288"
        owner: windowsbackup
      - name: ExternalTimeMachine
        uuid: "20bfc489-9252-4dba-8cc0-30a02ef34d79"
        owner: timemachinebackup
      - name: ExternalMisc
        uuid: "f7915820-09cf-4b57-9c13-ce5288fbe5c6"
        encrypted: true
        owner: miscbackup
      - name: ExtData
        uuid: "a2dc3a5d-30a3-46bc-9b6f-9954aa3aeaf9"
        owner: root
    # Every ext4 filesystem here, including the SD card root. mkfs defaults to
    # logging errors and carrying on, which let a corruption event in Apr 2026
    # rack up 258 errors on ExtData unnoticed while VictoriaMetrics kept writing
    # on top of it. Setting this in the superblock (rather than only in fstab)
    # also covers the kernel's initial mount of / and any manual mount.
    # USB partitions come from usb_partitions, by UUID because the sdX name
    # changes when a second drive is attached, or by /dev/mapper name for
    # encrypted ones. Devices that don't exist, such as a locked encrypted
    # partition, are skipped.
    ext4_remount_ro_devices: >-
      {{ ['/dev/mmcblk0p2']
         + (usb_partitions | rejectattr('encrypted', 'true') | map(attribute='uuid')
            | map('regex_replace', '^', '/dev/disk/by-uuid/') | list)
         + (usb_partitions | selectattr('encrypted', 'true') | map(attribute='name')
            | map('regex_replace', '^', '/dev/mapper/') | map('regex_replace', '$', '_crypt')
            | list) }}
  tasks:
    - name: Include secrets
      include_vars: secrets.yml
      tags: wip # Included so I get secrets with WIP tasks
    - import_tasks: tasks/system.yml
    - import_tasks: tasks/logging.yml
    - import_tasks: tasks/ddns.yml
    - import_tasks: tasks/samba.yml
    - import_tasks: tasks/drive_health.yml
    - import_tasks: tasks/apps.yml
    - import_tasks: tasks/ical-filter-proxy.yml
    - import_tasks: tasks/webserver.yml
    - import_tasks: tasks/mosquitto.yml
    - import_tasks: tasks/victoriametrics.yml
    - import_tasks: tasks/homeassistant.yml
  handlers:
    - import_tasks: handlers/main.yml
