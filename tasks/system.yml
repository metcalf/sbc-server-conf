---
- name: set UTC timezone
  community.general.timezone:
    name: UTC
  notify:
    - restart cron

- name: Generate locale
  locale_gen:
    name: en_US.UTF-8
    state: present

- name: Set system locale file
  copy:
    content: "LANG=en_US.UTF-8\n"
    dest: /etc/default/locale
    owner: root
    group: root
    mode: '0644'

# The CM5 defaults to the onboard PCB antenna. dtparam=ant2 selects the
# external u.FL antenna connector instead. Requires a reboot to take effect.
- name: Use external WiFi antenna on CM5
  lineinfile:
    path: /boot/firmware/config.txt
    line: dtparam=ant2
    insertafter: '^\[cm5\]'
    state: present
  notify:
    - reboot

- name: Read ext4 error behavior
  command: "dumpe2fs -h {{ item }}"
  register: ext4_superblock
  changed_when: false
  check_mode: false
  loop: "{{ ext4_remount_ro_devices }}"

# tune2fs -e always exits 0 and reports success even when nothing changed, so
# gate it on the superblock read above to keep this idempotent.
- name: Fail read-only on ext4 errors instead of continuing
  command: "tune2fs -e remount-ro {{ item.item }}"
  when: item.stdout is not search('Errors behavior:\s+Remount read-only')
  loop: "{{ ext4_superblock.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: sshd config
  copy:
    src: files/sshd_config
    dest: /etc/ssh/sshd_config
    validate: sudo sshd -t -f %s
    mode: "0644"
  notify:
    - reload sshd

- name: Generate non-root SSH host key
  become: true
  become_user: "{{ nonroot_login_user }}"
  command : ssh-keygen -q -t ed25519 -f /home/{{ nonroot_login_user }}/.ssh/id_ed25519 -C "" -N ""
  args:
    creates: /home/{{ nonroot_login_user }}/.ssh/id_ed25519

- name: Update package cache
  apt:
    update_cache: yes
    cache_valid_time: 36000 # 10 hours

- name: install dependencies
  apt:
    name:
      - ufw # For firewall
      - acl # Ansible needs this for some `become` stuff
    state: present

# ufw supports connection rate limiting, which is useful for protecting
# against brute-force login attacks. ufw will deny connections if an IP
# address has attempted to initiate 6 or more connections in the last
# 30 seconds. See  http://www.debian-administration.org/articles/187
# for details. Typical usage is:
- name: rate limit SSH connections
  community.general.ufw:
    rule: limit
    port: ssh
    proto: tcp

- name: Allow OpenSSH
  community.general.ufw:
    rule: allow
    name: OpenSSH

- name: Allow rsyslogd connections
  community.general.ufw:
    rule: allow
    port: 514

- name: Enable UFW
  community.general.ufw:
    state: enabled
